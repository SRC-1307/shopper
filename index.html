<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shopper</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
    }

    /* ── Chatbot widget ── */
    #chat-widget {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 12px;
    }

    /* Expanded chat panel */
    #chat-panel {
      width: 320px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.15);
      overflow: hidden;
      display: none;
      flex-direction: column;
    }

    #chat-panel.open { display: flex; }

    /* Header */
    #chat-header {
      background: #4285f4;
      color: white;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    #chat-header .title {
      font-weight: 600;
      font-size: 0.95rem;
    }

    #chat-header .subtitle {
      font-size: 0.75rem;
      opacity: 0.85;
    }

    #closeBtn {
      background: none;
      border: none;
      color: white;
      font-size: 1.2rem;
      cursor: pointer;
      line-height: 1;
      padding: 2px 4px;
      opacity: 0.85;
    }

    #closeBtn:hover { opacity: 1; }

    /* Message log */
    #chat-log {
      padding: 14px;
      min-height: 160px;
      max-height: 220px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: #f8f9fa;
    }

    .msg {
      font-size: 0.85rem;
      padding: 8px 12px;
      border-radius: 12px;
      max-width: 85%;
      line-height: 1.4;
    }

    .msg.bot {
      background: #e8f0fe;
      color: #1a1a2e;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .msg.user {
      background: #4285f4;
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .msg.error-msg {
      background: #fdecea;
      color: #c62828;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    /* Footer / controls */
    #chat-footer {
      padding: 12px 14px;
      border-top: 1px solid #eee;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    #status {
      font-size: 0.8rem;
      color: #777;
      flex: 1;
    }

    #status.error { color: #ea4335; }

    #recordBtn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: none;
      background: #4285f4;
      color: white;
      font-size: 1.3rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      box-shadow: 0 2px 8px rgba(66,133,244,0.4);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #recordBtn:hover:not(:disabled) { background: #3367d6; }
    #recordBtn:active:not(:disabled) { transform: scale(0.93); }
    #recordBtn.recording { background: #ea4335; box-shadow: 0 2px 8px rgba(234,67,53,0.4); }
    #recordBtn.processing, #recordBtn.playing { background: #aaa; cursor: not-allowed; box-shadow: none; }

    /* Launcher bubble */
    #launchBtn {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: none;
      background: #4285f4;
      color: white;
      font-size: 1.5rem;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(66,133,244,0.45);
      transition: background 0.2s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #launchBtn:hover { background: #3367d6; transform: scale(1.05); }

    .mic-icon { width: 22px; height: 22px; fill: white; pointer-events: none; }
    .mic-icon-sm { width: 18px; height: 18px; fill: white; pointer-events: none; }
  </style>
</head>
<body>

  <div id="chat-widget">
    <!-- Expanded panel -->
    <div id="chat-panel">
      <div id="chat-header">
        <div>
          <div class="title">Shopper</div>
        </div>
        <button id="closeBtn" title="Close">&#x2715;</button>
      </div>

      <div id="chat-log">
        <div class="msg bot">Hi! I'm Shopper. Press the mic and start speaking.</div>
      </div>

      <div id="chat-footer">
        <span id="status">Ready</span>
        <button id="recordBtn" title="Tap to record">
          <svg class="mic-icon-sm" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <rect x="9" y="2" width="6" height="11" rx="3"/>
            <path d="M5 11a7 7 0 0 0 14 0" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/>
            <line x1="12" y1="18" x2="12" y2="22" stroke="white" stroke-width="2" stroke-linecap="round"/>
            <line x1="8" y1="22" x2="16" y2="22" stroke="white" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Launcher bubble -->
    <button id="launchBtn" title="Open voice assistant">
      <svg class="mic-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <rect x="9" y="2" width="6" height="11" rx="3"/>
        <path d="M5 11a7 7 0 0 0 14 0" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/>
        <line x1="12" y1="18" x2="12" y2="22" stroke="white" stroke-width="2" stroke-linecap="round"/>
        <line x1="8" y1="22" x2="16" y2="22" stroke="white" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>
  </div>

  <script>
    const BACKEND_URL = window.BACKEND_URL || "http://localhost:8080";

    let mediaRecorder = null;
    let audioChunks = [];
    let currentState = "idle";
    let sessionId = null;   // persists across turns for Dialogflow context

    const btn        = document.getElementById("recordBtn");
    const statusEl   = document.getElementById("status");
    const chatLog    = document.getElementById("chat-log");
    const chatPanel  = document.getElementById("chat-panel");
    const launchBtn  = document.getElementById("launchBtn");
    const closeBtn   = document.getElementById("closeBtn");

    // Toggle panel
    launchBtn.addEventListener("click", () => {
      chatPanel.classList.add("open");
      launchBtn.style.display = "none";
    });

    closeBtn.addEventListener("click", () => {
      chatPanel.classList.remove("open");
      launchBtn.style.display = "flex";
    });

    function addMsg(text, type) {
      const div = document.createElement("div");
      div.className = `msg ${type}`;
      div.textContent = text;
      chatLog.appendChild(div);
      chatLog.scrollTop = chatLog.scrollHeight;
    }

    function setState(state, extra = "") {
      currentState = state;
      btn.className = state;

      const micSvg = `<svg class="mic-icon-sm" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <rect x="9" y="2" width="6" height="11" rx="3"/>
        <path d="M5 11a7 7 0 0 0 14 0" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/>
        <line x1="12" y1="18" x2="12" y2="22" stroke="white" stroke-width="2" stroke-linecap="round"/>
        <line x1="8" y1="22" x2="16" y2="22" stroke="white" stroke-width="2" stroke-linecap="round"/>
      </svg>`;
      const stopSvg = `<svg class="mic-icon-sm" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <rect x="6" y="6" width="12" height="12" rx="2"/>
      </svg>`;
      const spinSvg = `<svg class="mic-icon-sm" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="12" r="9" stroke="white" stroke-width="2" fill="none" stroke-dasharray="28 56" stroke-linecap="round">
          <animateTransform attributeName="transform" type="rotate" from="0 12 12" to="360 12 12" dur="0.9s" repeatCount="indefinite"/>
        </circle>
      </svg>`;

      const map = {
        idle:       { icon: micSvg,  disabled: false, text: "Ready" },
        recording:  { icon: stopSvg, disabled: false, text: "Recording..." },
        processing: { icon: spinSvg, disabled: true,  text: "Processing..." },
        playing:    { icon: spinSvg, disabled: true,  text: "Playing back..." },
        error:      { icon: micSvg,  disabled: false, text: extra || "Error" },
      };

      const s = map[state] || map.idle;
      btn.innerHTML = s.icon;
      btn.disabled = s.disabled;
      statusEl.textContent = s.text;
      statusEl.className = state === "error" ? "error" : "";
    }

    async function startRecording() {
      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      } catch (err) {
        setState("error", "Mic access denied");
        addMsg("Microphone access denied.", "error-msg");
        return;
      }

      const mimeType = MediaRecorder.isTypeSupported("audio/webm;codecs=opus")
        ? "audio/webm;codecs=opus"
        : "audio/webm";

      mediaRecorder = new MediaRecorder(stream, { mimeType });
      audioChunks = [];

      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) audioChunks.push(e.data);
      };

      mediaRecorder.onstop = async () => {
        stream.getTracks().forEach(t => t.stop());
        const blob = new Blob(audioChunks, { type: mimeType });
        await sendAudio(blob);
      };

      mediaRecorder.start();
      setState("recording");
    }

    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state === "recording") {
        mediaRecorder.stop();
        setState("processing");
      }
    }

    async function sendAudio(blob) {
      const formData = new FormData();
      formData.append("audio", blob, "recording.webm");

      // Append session_id as query param so Dialogflow keeps conversation context
      const url = sessionId
        ? `${BACKEND_URL}/process-audio?session_id=${encodeURIComponent(sessionId)}`
        : `${BACKEND_URL}/process-audio`;

      try {
        const resp = await fetch(url, { method: "POST", body: formData });

        if (!resp.ok) {
          let detail = "Server error";
          try { detail = (await resp.json()).detail; } catch (_) {}
          setState("error", detail);
          addMsg(detail, "error-msg");
          return;
        }

        // Persist session ID for the next turn
        const returnedSession = resp.headers.get("X-Session-Id");
        if (returnedSession) sessionId = returnedSession;

        const transcript = resp.headers.get("X-Transcript");
        const botReply   = resp.headers.get("X-Bot-Response");

        if (transcript) addMsg(transcript, "user");

        const audioBuffer = await resp.arrayBuffer();
        const audioBlob   = new Blob([audioBuffer], { type: "audio/mpeg" });
        const audioUrl    = URL.createObjectURL(audioBlob);
        const audio       = new Audio(audioUrl);

        if (botReply) addMsg(botReply, "bot");

        audio.onended = () => { URL.revokeObjectURL(audioUrl); setState("idle"); };
        audio.onerror = () => { URL.revokeObjectURL(audioUrl); setState("error", "Playback failed"); };

        setState("playing");
        audio.play();

      } catch (err) {
        setState("error", `Network error: ${err.message}`);
        addMsg(`Network error: ${err.message}`, "error-msg");
      }
    }

    btn.addEventListener("click", () => {
      if (currentState === "idle" || currentState === "error") startRecording();
      else if (currentState === "recording") stopRecording();
    });
  </script>
</body>
</html>
